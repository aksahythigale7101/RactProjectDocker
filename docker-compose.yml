services:
  backend:
    image: product-backend:1.0
    container_name: product-backend
    ports:
      - "8000:8000"
    volumes:
      - product-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  frontend:
    image: product-frontend:1.0
    container_name: product-frontend
    network_mode: host
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  product-data:
